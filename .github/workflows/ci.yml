name: runtime-package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Formatting and vet
        run: |
          test -z "$(gofmt -l cmd)"
          go vet ./...
      - name: Helper tests
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%$/, "", $NF); print $NF}')"
          awk -v total="$total" 'BEGIN {exit !(total >= 80 && total <= 100)}'
      - name: Builder tests
        run: |
          python3 -m trace --count --missing --summary --coverdir /tmp/python-coverage --module unittest discover -s scripts > /tmp/python-report.txt 2>&1
          cat /tmp/python-report.txt
          awk '$3 == "package_builder" {gsub(/%/, "", $2); coverage=$2+0; found=1; if (coverage < 80 || coverage > 100) exit 1} END {if (!found) exit 1}' /tmp/python-report.txt
      - name: Build four package archives
        run: bash scripts/build-packages.sh dist https://publisher.example/packages/example.coding/1.0.0
      - name: Validate archives
        run: |
          PYTHONPATH=scripts python3 -c 'from pathlib import Path; from package_builder import validate_archive; [validate_archive(p.read_bytes()) for p in Path("dist").glob("*/package.zip")]'
