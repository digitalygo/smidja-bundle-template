name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Validate bundle identity
        run: go test -count=1 -run '^(TestValidateIdentity|TestReadGoModIdentity|TestRepositoryIdentityMatchesGoMod|TestMinimumHarnessMatchesPinnedHarnessBase|TestBundleOriginMatchesGitHubRepository)$' .
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Build release binaries and checksums
        run: ./scripts/build-release.sh "$RELEASE_VERSION" dist
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

      - name: Verify checksums
        run: cd dist && sha256sum -c checksums.txt

      - name: Smoke the linux amd64 binary
        run: dist/smidja-linux-amd64 version --json

      - name: Publish release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231
        with:
          files: |
            dist/smidja-linux-amd64
            dist/smidja-linux-arm64
            dist/smidja-darwin-amd64
            dist/smidja-darwin-arm64
            dist/checksums.txt
          generate_release_notes: true
